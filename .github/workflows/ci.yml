name: Cinema CI/CD Check

# Kịch bản này sẽ tự động chạy mỗi khi ông Push code lên nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # NHIỆM VỤ 1: KIỂM TRA LỖI BACKEND (SPRING BOOT)
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (Tải code về máy ảo)
        uses: actions/checkout@v3

      - name: Cài đặt môi trường Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build và Kiểm tra lỗi Spring Boot
        # Chạy lệnh maven compile để check lỗi cú pháp
        run: |
          cd cinema_backend
          mvn clean compile

  # ==========================================
  # NHIỆM VỤ 2: KIỂM TRA LỖI FRONTEND (REACT/VITE)
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Vite tương thích tốt với Node 18+
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt thư viện và Build thử Frontend
        run: |
          cd frontend
          npm install
          npm run build