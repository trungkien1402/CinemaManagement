version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-database-prod
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    # We do NOT expose port 1433 to the public internet for security in production.
    # It remains accessible within the docker bridge network to other services.
    expose:
      - "1433"
    volumes:
      - mssql-data-prod:/var/opt/mssql
    restart: always

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-db-init-prod
    depends_on:
      - database
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo 'Waiting for SQL Server to start...'
        sleep 15
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'DATABASECNM') CREATE DATABASE DATABASECNM;"
        echo 'Database initialization check complete.'
    restart: on-failure

  backend:
    build:
      context: ./cinema_backend
      dockerfile: Dockerfile
    container_name: cinema-backend-prod
    # We do NOT expose port 8080 to the public host since Nginx handles forwarding
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://database:1433;databaseName=DATABASECNM;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${MSSQL_SA_PASSWORD}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - VNPAY_TMNCODE=${VNPAY_TMNCODE}
      - VNPAY_HASHSECRET=${VNPAY_HASHSECRET}
      - VNPAY_PAYURL=${VNPAY_PAYURL}
      - VNPAY_RETURNURL=${VNPAY_RETURNURL}
    depends_on:
      database:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinema-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mssql-data-prod:
